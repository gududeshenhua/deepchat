      async function testModifyTable() {
        try {
          console.log('=== 测试修改表结构 ===')

          // 首先创建学生表
          const studentSchema = `
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          name TEXT NOT NULL,
          age INTEGER,
          major TEXT,
          address TEXT,
          maritalStatus TEXT,
          graduated BOOLEAN DEFAULT 0
        `
          await sqliteManager.createTable('students', studentSchema)
          console.log('学生表创建成功')

          // 插入一些测试数据
          await sqliteManager.insert('students', {
            name: '测试学生',
            age: 20,
            major: '计算机科学',
            address: '北京市',
            maritalStatus: 'single',
            graduated: 0
          })
          console.log('测试数据插入成功')

          // 修改表结构，添加新字段
          const newStudentSchema = `
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          name TEXT NOT NULL,
          age INTEGER,
          major TEXT,
          address TEXT,
          maritalStatus TEXT,
          graduated BOOLEAN DEFAULT 0,
          email TEXT,
          phone TEXT
        `
          await sqliteManager.modifyTable('students', newStudentSchema)
          console.log('表结构修改成功，添加了email和phone字段')

          // 验证表结构修改
          const students = await sqliteManager.getAllData('students')
          console.log('修改后的学生数据:', students)
        } catch (error) {
          console.error('修改表结构测试失败:', error)
        }
      }

      async function testDropTable() {
        try {
          console.log('=== 测试删除表 ===')

          // 创建临时表
          const tempSchema = `
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          temp_field TEXT
        `
          await sqliteManager.createTable('temp_table', tempSchema)
          console.log('临时表创建成功')

          // 删除表
          await sqliteManager.dropTable('temp_table')
          console.log('临时表删除成功')
        } catch (error) {
          console.error('删除表测试失败:', error)
        }
      }

      async function testTruncateTable() {
        try {
          console.log('=== 测试清空表 ===')

          // 创建测试表
          const testSchema = `
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          content TEXT
        `
          await sqliteManager.createTable('test_table', testSchema)
          console.log('测试表创建成功')

          // 插入一些数据
          await sqliteManager.batchInsert('test_table', [
            { content: '测试数据1' },
            { content: '测试数据2' },
            { content: '测试数据3' }
          ])
          console.log('测试数据插入成功')

          // 验证数据存在
          const beforeTruncate = await sqliteManager.getAllData('test_table')
          console.log('清空前数据条数:', beforeTruncate.length)

          // 清空表
          await sqliteManager.truncateTable('test_table')
          console.log('表清空成功')

          // 验证表已清空
          const afterTruncate = await sqliteManager.getAllData('test_table')
          console.log('清空后数据条数:', afterTruncate.length)
        } catch (error) {
          console.error('清空表测试失败:', error)
        }
      }
